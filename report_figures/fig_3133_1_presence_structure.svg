<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <defs>
    <marker id="a5" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5a6b7b"/></marker>
  </defs>
  <rect width="600" height="300" fill="#ffffff"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#15202b">presence 폴백 구조 — 트랙 OR 포인트 (좌석 존별 독립)</text>

  <!-- track path -->
  <rect x="30" y="70" width="150" height="46" rx="8" fill="#dcf0f4" stroke="#0d7490"/>
  <text x="105" y="90" text-anchor="middle" font-size="12" fill="#08414f">트랙 (TLV 1010)</text>
  <text x="105" y="107" text-anchor="middle" font-size="10.5" fill="#5a6b7b">GTRACK 트래커</text>
  <rect x="220" y="70" width="150" height="46" rx="8" fill="#f0f2f4" stroke="#b8c6d0"/>
  <text x="295" y="97" text-anchor="middle" font-size="11.5" fill="#1a2b33">존 내 트랙 존재?</text>

  <!-- point path -->
  <rect x="30" y="184" width="150" height="46" rx="8" fill="#dcf0f4" stroke="#0d7490"/>
  <text x="105" y="204" text-anchor="middle" font-size="12" fill="#08414f">포인트 (TLV 1020)</text>
  <text x="105" y="221" text-anchor="middle" font-size="10.5" fill="#5a6b7b">포인트클라우드</text>
  <rect x="220" y="184" width="150" height="46" rx="8" fill="#f0f2f4" stroke="#b8c6d0"/>
  <text x="295" y="205" text-anchor="middle" font-size="11.5" fill="#1a2b33">존 내 포인트 ≥ 3?</text>

  <!-- OR gate -->
  <circle cx="440" cy="150" r="30" fill="#eef7f0" stroke="#1a7f4b" stroke-width="1.6"/>
  <text x="440" y="155" text-anchor="middle" font-size="15" font-weight="700" fill="#1a7f4b">OR</text>

  <!-- output -->
  <rect x="500" y="127" width="86" height="46" rx="8" fill="#f6dedb" stroke="#c23a2f"/>
  <text x="543" y="147" text-anchor="middle" font-size="12" font-weight="600" fill="#c23a2f">존 점유</text>
  <text x="543" y="164" text-anchor="middle" font-size="10" fill="#c23a2f">(히스테리시스)</text>

  <!-- arrows -->
  <g stroke="#5a6b7b" stroke-width="1.6" marker-end="url(#a5)">
    <line x1="180" y1="93" x2="218" y2="93"/>
    <line x1="180" y1="207" x2="218" y2="207"/>
    <line x1="370" y1="93" x2="418" y2="132"/>
    <line x1="370" y1="207" x2="418" y2="168"/>
    <line x1="470" y1="150" x2="498" y2="150"/>
  </g>

  <text x="300" y="276" text-anchor="middle" font-size="11" fill="#8695a4">각 좌석 존마다 로컬 포인트로 독립 판정 → 트랙이 특정 인원에 쏠려도 정지 승객 개별 검출</text>
</svg>
