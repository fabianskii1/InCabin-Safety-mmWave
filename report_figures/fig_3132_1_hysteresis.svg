<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <rect width="660" height="300" fill="#ffffff"/>
  <text x="330" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#15202b">비대칭 히스테리시스 타이밍</text>
  <text x="330" y="42" text-anchor="middle" font-size="11" fill="#8695a4">OCCUPIED 빠른 래치(0.4s) · EMPTY 느린 확정(4.0s) · 순간 소실 HOLD(1.5s) 브리징</text>

  <!-- time axis reference lines -->
  <!-- x = 60 + t*46 ; t: 0..12s -->
  <!-- lane 1: track detect -->
  <text x="52" y="86" text-anchor="end" font-size="11" fill="#1a2b33">트랙 감지</text>
  <line x1="60" y1="95" x2="612" y2="95" stroke="#d7e0e8" stroke-width="1"/>
  <!-- present [1,5] and [6,8] -->
  <rect x="106" y="66" width="184" height="20" rx="3" fill="#0d7490"/>
  <rect x="336" y="66" width="92" height="20" rx="3" fill="#0d7490"/>
  <text x="303" y="82" font-size="9.5" fill="#c23a2f">소실</text>

  <!-- lane 2: zone state -->
  <text x="52" y="150" text-anchor="end" font-size="11" fill="#1a2b33">존 상태</text>
  <!-- UNKNOWN [0,1.4] gray -->
  <rect x="60" y="130" width="64" height="22" rx="3" fill="#9aa7b2"/>
  <text x="92" y="146" text-anchor="middle" font-size="9" fill="#fff">UNK</text>
  <!-- OCCUPIED [1.4,12] red -->
  <rect x="124" y="130" width="488" height="22" rx="3" fill="#c23a2f"/>
  <text x="360" y="146" text-anchor="middle" font-size="10" fill="#fff">OCCUPIED (홀드로 소실 구간 유지)</text>
  <!-- EMPTY after 12 -->
  <rect x="612" y="130" width="0" height="22"/>

  <!-- annotations -->
  <!-- 0.4 latch -->
  <line x1="106" y1="60" x2="106" y2="158" stroke="#1a7f4b" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="124" y1="60" x2="124" y2="158" stroke="#1a7f4b" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="115" y="178" text-anchor="middle" font-size="9.5" fill="#1a7f4b">0.4s</text>
  <text x="150" y="196" text-anchor="middle" font-size="10" fill="#1a7f4b">빠른 래치</text>

  <!-- hold bridging gap [5,6] -->
  <rect x="290" y="128" width="46" height="26" fill="none" stroke="#b4610a" stroke-width="1.3" stroke-dasharray="3 2"/>
  <text x="313" y="216" text-anchor="middle" font-size="10" fill="#b4610a">HOLD 1.5s</text>
  <text x="313" y="230" text-anchor="middle" font-size="9.5" fill="#b4610a">브리징</text>

  <!-- empty confirm 4s after t=8 -->
  <line x1="428" y1="60" x2="428" y2="158" stroke="#5a6b7b" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="612" y1="60" x2="612" y2="158" stroke="#5a6b7b" stroke-width="1" stroke-dasharray="3 2"/>
  <path d="M428,250 L612,250" stroke="#5a6b7b" stroke-width="1.2" marker-end="url(#a3)"/>
  <defs><marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5a6b7b"/></marker></defs>
  <text x="520" y="244" text-anchor="middle" font-size="10.5" fill="#5a6b7b">EMPTY_CONFIRM 4.0s (느린 확정)</text>
  <text x="520" y="268" text-anchor="middle" font-size="9.5" fill="#8695a4">→ 이후 EMPTY 확정</text>

  <text x="336" y="290" text-anchor="middle" font-size="10" fill="#8695a4">판정을 항상 '점유' 쪽으로 편향 → 위험 방향(놓침)의 실패를 지연·차단</text>
</svg>
