<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <rect width="660" height="300" fill="#ffffff"/>
  <text x="330" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#15202b">static death와 presence 보완 (타임라인)</text>
  <text x="330" y="42" text-anchor="middle" font-size="11" fill="#8695a4">정지 승객의 트랙 소실 구간을 포인트-presence가 메워 점유 유지</text>

  <!-- lane 1: track -->
  <text x="56" y="86" text-anchor="end" font-size="11" fill="#1a2b33">트랙</text>
  <line x1="66" y1="95" x2="620" y2="95" stroke="#d7e0e8" stroke-width="1"/>
  <rect x="90" y="66" width="150" height="20" rx="3" fill="#0d7490"/>
  <rect x="470" y="66" width="120" height="20" rx="3" fill="#0d7490"/>
  <!-- gap [240..470] -->
  <rect x="240" y="64" width="230" height="24" fill="none" stroke="#c23a2f" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="355" y="60" text-anchor="middle" font-size="10.5" fill="#c23a2f">트랙 소실 (static death)</text>

  <!-- lane 2: points -->
  <text x="56" y="150" text-anchor="end" font-size="11" fill="#1a2b33">포인트</text>
  <line x1="66" y1="159" x2="620" y2="159" stroke="#d7e0e8" stroke-width="1"/>
  <g fill="#1a7f4b">
    <circle cx="110" cy="150" r="3.5"/><circle cx="150" cy="152" r="3.5"/><circle cx="200" cy="149" r="3.5"/>
    <circle cx="260" cy="151" r="3.5"/><circle cx="300" cy="150" r="3.5"/><circle cx="345" cy="152" r="3.5"/>
    <circle cx="400" cy="149" r="3.5"/><circle cx="445" cy="151" r="3.5"/><circle cx="500" cy="150" r="3.5"/>
    <circle cx="560" cy="151" r="3.5"/>
  </g>
  <text x="355" y="176" text-anchor="middle" font-size="10" fill="#1a7f4b">소실 구간에도 포인트는 유지</text>

  <!-- lane 3: OR occupancy -->
  <text x="56" y="222" text-anchor="end" font-size="11" fill="#1a2b33">OR 점유</text>
  <rect x="90" y="204" width="500" height="22" rx="3" fill="#c23a2f"/>
  <text x="340" y="220" text-anchor="middle" font-size="10.5" fill="#fff">OCCUPIED 연속 유지 (트랙 없이도 포인트로)</text>

  <!-- bridge annotation -->
  <line x1="240" y1="88" x2="240" y2="204" stroke="#b4610a" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="470" y1="88" x2="470" y2="204" stroke="#b4610a" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="355" y="250" text-anchor="middle" font-size="11" fill="#b4610a">↑ 트랙만으로는 EMPTY로 빠질 구간을 presence가 메움</text>

  <text x="343" y="284" text-anchor="middle" font-size="10.5" fill="#8695a4">→ 뒷좌 위험 오허용(놓침) 저감</text>
</svg>
