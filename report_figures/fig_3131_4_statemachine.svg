<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 290" font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#5a6b7b"/>
    </marker>
  </defs>
  <rect width="660" height="290" fill="#ffffff"/>
  <text x="330" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#15202b">트랙 생명주기 상태전이</text>

  <!-- states -->
  <rect x="40" y="90" width="130" height="56" rx="10" fill="#f0f2f4" stroke="#b8c6d0"/>
  <text x="105" y="116" text-anchor="middle" font-size="13" font-weight="600" fill="#1a2b33">DETECTION</text>
  <text x="105" y="133" text-anchor="middle" font-size="10.5" fill="#5a6b7b">후보 (미리포트)</text>

  <rect x="265" y="90" width="130" height="56" rx="10" fill="#dcf0f4" stroke="#0d7490"/>
  <text x="330" y="116" text-anchor="middle" font-size="13" font-weight="600" fill="#08414f">ACTIVE</text>
  <text x="330" y="133" text-anchor="middle" font-size="10.5" fill="#0d7490">확정·리포트</text>

  <rect x="490" y="90" width="130" height="56" rx="10" fill="#f6dedb" stroke="#c23a2f"/>
  <text x="555" y="116" text-anchor="middle" font-size="13" font-weight="600" fill="#c23a2f">FREE</text>
  <text x="555" y="133" text-anchor="middle" font-size="10.5" fill="#c23a2f">소멸</text>

  <!-- DET -> ACTIVE -->
  <line x1="170" y1="118" x2="263" y2="118" stroke="#5a6b7b" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="216" y="108" text-anchor="middle" font-size="10.5" fill="#1a7f4b">확정 히트 det2act(3)회</text>

  <!-- ACTIVE -> FREE -->
  <line x1="395" y1="118" x2="488" y2="118" stroke="#5a6b7b" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="441" y="108" text-anchor="middle" font-size="10.5" fill="#c23a2f">결측 &gt; 임계</text>

  <!-- DET -> FREE (curved bottom) -->
  <path d="M105,146 C105,215 555,215 555,148" fill="none" stroke="#9aa7b2" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a2)"/>
  <text x="330" y="210" text-anchor="middle" font-size="10.5" fill="#9aa7b2">결측 누적(미확정 폐기)</text>

  <!-- static retention highlight -->
  <rect x="248" y="188" width="230" height="46" rx="8" fill="#eef7f0" stroke="#1a7f4b" stroke-dasharray="4 3"/>
  <text x="363" y="207" text-anchor="middle" font-size="11" font-weight="600" fill="#1a7f4b">정지 + 정적박스 내부일 때</text>
  <text x="363" y="224" text-anchor="middle" font-size="11" fill="#1a7f4b">static2free = 6000 프레임 장기 유지</text>
  <line x1="330" y1="146" x2="345" y2="186" stroke="#1a7f4b" stroke-width="1.3" stroke-dasharray="3 3"/>

  <text x="330" y="266" text-anchor="middle" font-size="10.5" fill="#8695a4">정지 착석자는 새 검출이 없어도 트랙이 소멸하지 않고 유지됨</text>
</svg>
