  <rect x="40" y="456" width="536" height="152" rx="10" fill="#FBEFD3" stroke="#B87A1E" stroke-width="1.4"/>
  <text x="54" y="474" font-size="11.5" font-weight="700" fill="#6E4A12">◆ 우리가 개발 (졸음/응급)</text>

  <rect x="56" y="496" width="150" height="46" rx="8" fill="#FFFFFF" stroke="#B87A1E"/>
  <text x="131" y="516" font-size="10.2" font-weight="700" text-anchor="middle" fill="#6E4A12">HRV / RMSSD 산출</text>
  <text x="131" y="531" font-size="9.2" text-anchor="middle" fill="#6E4A12">심박 파형 → IBI</text>

  <rect x="230" y="496" width="150" height="46" rx="8" fill="#FFFFFF" stroke="#B87A1E"/>
  <text x="305" y="516" font-size="10.2" font-weight="700" text-anchor="middle" fill="#6E4A12">졸음 판정 모델</text>
  <text x="305" y="531" font-size="9.2" text-anchor="middle" fill="#6E4A12">HR·RR·HRV 근거</text>

  <rect x="404" y="496" width="150" height="46" rx="8" fill="#FFFFFF" stroke="#B87A1E"/>
  <text x="479" y="516" font-size="10.2" font-weight="700" text-anchor="middle" fill="#6E4A12">무호흡·응급 감지</text>
