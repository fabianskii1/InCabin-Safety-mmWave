  <line x1="289" y1="134" x2="289" y2="218" stroke="#0C447C" stroke-width="1.5"/>
  <line x1="289" y1="134" x2="300" y2="134" stroke="#0C447C" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="289" y1="218" x2="300" y2="218" stroke="#0C447C" stroke-width="1.5" marker-end="url(#a)"/>
