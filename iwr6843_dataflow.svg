<svg viewBox="0 0 640 636" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Segoe UI', 'Malgun Gothic', sans-serif">
  <title>IWR6843 졸음/응급 판정 시스템 데이터 흐름 v4</title>
  <desc>칩 펌웨어는 존 점유·HR/RR·파형을 TLV로 출력하고, PC가 파싱·시각화·로깅하며, HR/RR/HRV 기반 졸음 판정과 무호흡·응급 감지를 새로 개발해 알림/ECU로 연동한다.</desc>

  <rect x="0" y="0" width="640" height="636" fill="#ffffff"/>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#0C447C"/></marker>
    <marker id="am" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#B87A1E"/></marker>
  </defs>

  <text x="24" y="26" font-size="15" font-weight="700" fill="#1a1a1a">IWR6843 · 졸음/응급 판정 시스템 — 데이터 흐름</text>
  <rect x="24" y="38" width="12" height="12" rx="3" fill="#E6F1FB" stroke="#0C447C"/>
  <text x="41" y="48" font-size="10.5" fill="#555">기존(펌웨어·파싱) 활용</text>
  <rect x="205" y="38" width="12" height="12" rx="3" fill="#FBEFD3" stroke="#B87A1E"/>
  <text x="222" y="48" font-size="10.5" fill="#555">우리가 개발</text>

  <!-- ============ CHIP LAYER ============ -->
  <rect x="24" y="62" width="592" height="196" rx="12" fill="#EEF5FC" stroke="#0C447C" stroke-width="1.5"/>
  <text x="38" y="82" font-size="12.5" font-weight="700" fill="#042C53">■ IWR6843 칩 · 온칩 신호처리</text>

  <rect x="45" y="150" width="104" height="52" rx="8" fill="#E6F1FB" stroke="#0C447C"/>
  <text x="97" y="171" font-size="10.8" font-weight="700" text-anchor="middle" fill="#042C53">FMCW 송수신</text>
  <text x="97" y="187" font-size="9.3" text-anchor="middle" fill="#0C447C">60GHz · 3TX/4RX</text>

  <rect x="165" y="150" width="112" height="52" rx="8" fill="#E6F1FB" stroke="#0C447C"/>
  <text x="221" y="171" font-size="10.8" font-weight="700" text-anchor="middle" fill="#042C53">Range-FFT·히트맵</text>
  <text x="221" y="187" font-size="9.3" text-anchor="middle" fill="#0C447C">공간 ROI 매핑</text>

  <rect x="300" y="112" width="126" height="44" rx="8" fill="#E6F1FB" stroke="#0C447C"/>
  <text x="363" y="131" font-size="10.8" font-weight="700" text-anchor="middle" fill="#042C53">존 점유 판정</text>
  <text x="363" y="146" font-size="9.3" text-anchor="middle" fill="#0C447C">재실 · CPD</text>

  <rect x="300" y="196" width="126" height="44" rx="8" fill="#E6F1FB" stroke="#0C447C"/>
  <text x="363" y="215" font-size="10.8" font-weight="700" text-anchor="middle" fill="#042C53">생체신호 추출</text>
  <text x="363" y="230" font-size="9.3" text-anchor="middle" fill="#0C447C">호흡·심박 파형 + HR/RR</text>

