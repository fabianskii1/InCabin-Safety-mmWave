  <text x="99" y="366" font-size="9.3" text-anchor="middle" fill="#0C447C">cfg 구성</text>

  <rect x="450" y="330" width="110" height="46" rx="8" fill="#E6F1FB" stroke="#0C447C"/>
  <text x="505" y="350" font-size="10.6" font-weight="700" text-anchor="middle" fill="#042C53">TLV 파싱</text>
