  <line x1="131" y1="480" x2="479" y2="480" stroke="#B87A1E" stroke-width="1.4"/>
  <line x1="131" y1="480" x2="131" y2="496" stroke="#B87A1E" stroke-width="1.4" marker-end="url(#am)"/>
  <line x1="479" y1="480" x2="479" y2="496" stroke="#B87A1E" stroke-width="1.4" marker-end="url(#am)"/>
  <line x1="206" y1="519" x2="230" y2="519" stroke="#B87A1E" stroke-width="1.4" marker-end="url(#am)"/>
  <line x1="305" y1="542" x2="305" y2="560" stroke="#B87A1E" stroke-width="1.4" marker-end="url(#am)"/>
  <line x1="479" y1="542" x2="479" y2="551" stroke="#B87A1E" stroke-width="1.4"/>
  <line x1="479" y1="551" x2="355" y2="551" stroke="#B87A1E" stroke-width="1.4"/>
  <line x1="355" y1="551" x2="355" y2="560" stroke="#B87A1E" stroke-width="1.4" marker-end="url(#am)"/>

  <!-- ============ UART boundary arrows (drawn last = on top) ============ -->
  <text x="112" y="281" font-size="10" font-weight="700" fill="#0C447C">cfg 전송 · CLI UART 115200</text>
  <text x="490" y="281" font-size="10" font-weight="700" text-anchor="end" fill="#0C447C">TLV 결과 · Data UART 921600</text>
  <line x1="97" y1="330" x2="97" y2="204" stroke="#0C447C" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="505" y1="204" x2="505" y2="332" stroke="#0C447C" stroke-width="1.8" marker-end="url(#a)"/>
</svg>
