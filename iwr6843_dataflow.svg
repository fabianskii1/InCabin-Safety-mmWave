  <rect x="398" y="396" width="100" height="46" rx="8" fill="#E6F1FB" stroke="#0C447C"/>
  <text x="448" y="416" font-size="10.2" font-weight="700" text-anchor="middle" fill="#042C53">로깅</text>
  <text x="448" y="431" font-size="9.3" text-anchor="middle" fill="#0C447C">CSV 저장</text>

  <line x1="505" y1="376" x2="505" y2="386" stroke="#0C447C" stroke-width="1.4"/>
  <line x1="115" y1="386" x2="505" y2="386" stroke="#0C447C" stroke-width="1.4"/>
  <line x1="115" y1="386" x2="115" y2="396" stroke="#0C447C" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="294" y1="386" x2="294" y2="396" stroke="#0C447C" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="448" y1="386" x2="448" y2="396" stroke="#0C447C" stroke-width="1.4" marker-end="url(#a)"/>

