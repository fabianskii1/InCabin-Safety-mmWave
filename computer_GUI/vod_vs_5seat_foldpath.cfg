% ============================================================================
% 5인승 승용차 · 룸미러 장착 · 시트 폴딩 끼임 방지용 전용 cfg
% ----------------------------------------------------------------------------
% 센서: IWR6843, 룸미러(윈드실드 상단 중앙)에서 후방·하향으로 캐빈 조사
% 거리 분해능 ~5.26cm/bin, 방위 boresight = angle bin 24
%
% [중요] 이 펌웨어 포크는 정적 존 CPD 판정을 사용하지 않고(dss_data_path.c 의
%        ODDemo_Decision_process 루프 주석 처리됨) 히트맵 피크 기반 동적
%        다중 인원 검출(최대 4명, 방위 순 정렬)을 사용함. 따라서 아래 zoneDef 는
%        "검출을 좌석으로 제한"하지 않으며, 호스트측 좌석 매핑/시각화 메타데이터로만
%        의미가 있음. 실제 검출 게이트는 firmware 하드코딩 임계값(oddemo_heatmap.c
%        heatmapGetPeaks: heat >= 2000.0f)임 — 약한 아동 반사가 이 값 미만이면
%        vital signs 슬롯 자체가 생성되지 않아 clearance 가 EMPTY 로 오판할 수 있음.
%        아동 크기 타깃으로 이 임계값 검증/하향이 필수(별도 firmware 작업).
% ============================================================================

sensorStop
flushCfg
dfeDataOutputMode 1
channelCfg 15 5 0
adcCfg 2 1
adcbufCfg -1 0 0 1 1
profileCfg 0 60 250 10 40 0 0 98 1 64 2200 0 0 40
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 4
% 200ms 프레임 = 5 fps. 폴딩(수 초) 대비 충분한 실시간성 + VS 체인 안정 샘플링
frameCfg 0 1 168 0 200 1 0
lowPower 0 0
guiMonitor 1 16 1
dvsGuiMonitor 0 0 0 0 0
% 흉부 위상 추출 range gate: 앞열(~0.45m)부터 뒷열(~1.50m)까지 전 좌석 커버
vitalSignsCfg 0.45 1.50 256 512 4 0.1 0.05 100000 300000
motionDetection 1 20 2.0 0

%OD Demo commands:
% 폴딩 위험 좌석 4곳 (호스트측 좌석 매핑/표시용). range=거리bin, angle=방위bin(24=정면)
%   Zone0 뒷열-좌 : range 18-28(~0.95-1.47m), angle 10-19(-36°~-12°)
%   Zone1 뒷열-중 : range 18-28,              angle 19-30(-12°~+14°)
%   Zone2 뒷열-우 : range 18-28,              angle 30-39(+14°~+39°)
%   Zone3 앞열-동승: range  9-18(~0.47-0.95m), angle 30-41(+14°~+45°) — 뒷열과 거리로 분리
% 주: 5인승 5명 탑승 시 firmware 는 가장 강한 4개 피크만 추적(운전석 제외 우선). 4인 초과 불가.
zoneDef 4  18 10 10 9  18 10 19 11  18 10 30 9  9 9 30 11

% CPD 분류기 계수 — 현재 firmware 에선 decision 루프가 비활성이라 미사용이나,
% 향후 정적 존 판정 재활성화 대비해 pair 0/1 모두 정의(pair1 은 pair0 가중치 재사용,
% 재캡처 전까지의 placeholder). 4존 = 2 pair 이므로 두 세트 필요.
